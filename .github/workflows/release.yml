name: Release

# Tag → release pipeline. Push a tag like `v1.2.0` (or `v1.2.0-rc1` for a
# prerelease) and this builds all 5 targets with build.sh, stamps main.Version
# from the tag, generates SHA256SUMS, and publishes everything as GitHub Release
# assets at the canonical `releases/<tag>/download/` URL.
#
# This is what makes the Phase-2 bootstrap one-liner resolve: get.sh (and
# `lattice update`) default their download base to
# https://github.com/shleesauce/lattice/releases/latest/download, which GitHub
# aliases to the newest non-prerelease tag built here. The asset filenames MUST
# stay exactly lattice-<os>-<arch>[.exe], get.sh, get.ps1, SHA256SUMS — those
# names are hardcoded in the installers and the self-updater.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify module checksums
        run: go mod verify

      - name: Build all targets (tag stamps main.Version)
        run: LATTICE_VERSION=${{ github.ref_name }} bash scripts/build.sh

      - name: Generate checksums
        # Filenames only (no paths) so the format matches what `lattice update`
        # parses: "sha256<two spaces>lattice-<os>-<arch>".
        run: cd dist && sha256sum lattice-* > SHA256SUMS

      - name: Stage installers as assets
        run: cp install/get.sh install/get.ps1 install/uninstall.sh install/uninstall.ps1 dist/

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # A partial build (missing binary) would otherwise publish a release
          # whose SHA256SUMS only covers whatever happened to be present. Fail
          # instead so the release is all-or-nothing.
          fail_on_unmatched_files: true
          files: |
            dist/lattice-darwin-arm64
            dist/lattice-darwin-amd64
            dist/lattice-windows-amd64.exe
            dist/lattice-linux-amd64
            dist/lattice-linux-arm64
            dist/get.sh
            dist/get.ps1
            dist/uninstall.sh
            dist/uninstall.ps1
            dist/SHA256SUMS
